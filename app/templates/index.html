<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TestForge Demo Store</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 520px; margin: 60px auto; }
        input { display: block; width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { padding: 10px 18px; cursor: pointer; }
        #message { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>TestForge Demo Store</h1>
    <p>Demo application used as the system under test.</p>

    <form id="loginForm">
        <input id="email" type="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <button id="loginButton" type="submit">Login</button>
    </form>

    <div id="message"></div>

    <script>
        const form = document.getElementById("loginForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            if (!email || !password) {
                message.textContent = "Email and password are required";
                return;
            }

            const response = await fetch("/api/login", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({email, password})
            });

            const data = await response.json();
            message.textContent = data.message;
        });
    </script>
</body>
</html>
